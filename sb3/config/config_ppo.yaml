others:
  random_seed: null  # null = new random seed each run (printed at start); set a number to reproduce

environment:
  thruster_size: 4
  servo_joints_size: 0
  max_action: 1.0
  min_servo_angle_rad: -0.785 # -45 degrees in radians
  max_servo_angle_rad: 0.785 # 45 degrees in radians

training:
  max_episodes: 1000
  max_t: 200
  save_freq_timesteps: 100000  # every 100k steps = the checkpoint-eval spacing (10k gave 300 files/run)

agent:
  learning_rate: 0.0003  # Slightly higher for PPO
  n_steps: 2048  # Number of steps to collect before each update
  batch_size: 64  # Minibatch size for each gradient update
  n_epochs: 10  # Number of epochs when optimizing the surrogate loss
  gamma: 0.99  # Discount factor
  gae_lambda: 0.95  # GAE lambda parameter
  clip_range: 0.2  # Clipping parameter for PPO
  clip_range_vf: null  # Clipping parameter for value function (null = same as clip_range)
  ent_coef: 0.0  # Entropy coefficient for the loss calculation
  vf_coef: 0.5  # Value function coefficient for the loss calculation
  max_grad_norm: 0.5  # Gradient clipping threshold

qnetwork:
  actor_hidden_layers: [256, 256, 128]  # Same as SAC for consistency

# Coupling-aware reward configuration - supports all 4 methods
coupling:
  method: 'v4'  # Options: 'v1', 'v2', 'v3', 'v4', 'standard'
  
  # Base coupling strength parameters (used by all methods)
  surge_yaw_weight: 0.25  # REDUCED from 0.3 (less aggressive surge-yaw)
  pitch_depth_weight: 0.6  # INCREASED from 0.4 (stronger pitch-depth coupling)
  threshold: 0.05
  
  # Progressive learning parameters (for v2)
  progressive:
    enabled: true
    exploration_episodes: 50  # Phase 1: Pure exploration
    coupling_focus_episodes: 100  # Phase 2: Focus on learning coupled pairs
    # Phase 3 (refinement) starts automatically after coupling_focus_episodes
  
  # Dynamic coupling parameters (for v3)
  dynamic:
    history_window: 15  # Number of steps to consider for correlation analysis
    adaptation_rate: 0.1  # How quickly coupling weights adapt (0.0-1.0)
  
  # Energy-based parameters (for v4)
  energy:
    spring_stiffness: 0.3  # REDUCED from 0.5 (gentler coupling)
    damping_factor: 0.4  # INCREASED from 0.2 (more damping for stability)
  
  # Surge-specific fixes for asymmetric response
  surge_fixes:
    priority_mode: true
    error_threshold: 0.15
    coupling_reduction: 0.3
    progress_bonus_scale: 0.2
    setpoint_tracking_bonus: 0.15

reward_function:
  w1: 0.8  # REDUCED from 1.0 (less harsh energy penalty)
  w2: 0.0  # Servo smoothness penalty
  w3: 0.0  # Thruster usage penalty
  w4: 0.2  # INCREASED from 0.1 (more thruster smoothness)
  w5: 0.0  # Servo angle penalty
  w6: 0.0  # Thruster delta reward
  w7: 0.2  # INCREASED from 0.1 (more action smoothness)
  w8: 0.1  # Direction change penalty
  
  # Individual state error weights (used in coupling calculations)
  state_error_weights: [
    0.002,  # z (depth) - INCREASED for better pitch-depth coupling
    0.01,   # surge - INCREASED to fix asymmetric response
    0.0001, # sway
    0.0,    # heave
    0.0,    # roll
    0.001,  # pitch - INCREASED to reduce 0.3 rad error
    0.0008  # yaw - INCREASED to fix offset issue
  ]

action_penalties:
  surge_asymmetry_penalty: 0.1  # Penalty for unequal positive/negative response
  yaw_bias_penalty: 0.05

pid_gains:
  # These are multipliers on top of state_error_weights
  P_multiplier: 1.0  # Base proportional gain multiplier
  I_multiplier: 1.0  # Base integral gain multiplier
  D_multiplier: 0.0  # Base derivative gain multiplier
  
  component_multipliers:
    # Adjusted for coupling-aware control
    z: [1.0, 0.0, 0.0]     # depth
    surge: [1.0, 0.0, 0.0] # surge
    pitch: [1.0, 0.0, 0.0] # pitch
    yaw: [1.0, 0.0, 0.0]   # yaw

plotting:
  plot_interval: 10

evaluation:
  num_episodes: 100  # Reduced from 10000 for reasonable testing time
  verbose: true